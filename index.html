<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>

  <!-- Elemen dekoratif di background, sumber efek blur -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <!-- LAYAR 1: Input Nama -->
  <section id="screen-name" class="screen active">
    <div class="card">
      <h1>Siapa nama kamu?</h1>
      <input type="text" id="nameInput" class="rounded-input" placeholder="Tulis nama di sini...">
      <p class="hint">Tidak harus nama asli kok, bebas pakai apa saja.</p>
      <button id="beginBtn" class="rounded-btn">Mulai Tulis</button>
    </div>
  </section>

  <!-- LAYAR 2: Main Content (Form Pesan) -->
  <section id="screen-main" class="screen">
    <div class="card">
      <button id="backToNameBtn" class="icon-btn" aria-label="Kembali ke halaman nama">←</button>
      <h2 id="greeting">Halo!</h2>

      <div class="tag-group">
        <button class="tag-btn" data-tag="Confession">Confession</button>
        <button class="tag-btn" data-tag="Sharing">Sharing</button>
      </div>

      <textarea id="messageInput" class="rounded-input textarea" placeholder="Tulis pesan rahasiamu di sini..."></textarea>

      <button id="sendBtn" class="rounded-btn">Kirim</button>
      <p id="statusText" class="hint"></p>
      <button id="previewTriggerBtn" class="rounded-btn preview-trigger-btn" style="display:none;">Lihat Pesan</button>
    </div>
  </section>

  <!-- LAYAR 3: Preview Mode (modul terpisah, lihat preview.css & preview.js) -->
  <section id="screen-preview" class="screen">
    <div class="preview-container">
      <button id="previewBackBtn" class="icon-btn" aria-label="Kembali menulis">←</button>

      <div class="preview-readable">
        <p id="readableText"></p>
      </div>

      <div class="paper-wrapper" id="paperWrapper">
        <img src="assets/images/paper.jpg" alt="Kertas surat" class="paper-image">
        <div class="paper-text-overlay">
          <p id="paperMessageText"></p>
          <p class="paper-from">From: <span id="paperFromName"></span></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Bagian ini nanti diisi desain: author / cerita di belakang website -->
  <footer id="author-section">
    <!-- konten author/story ditambahkan di fase desain -->
  </footer>

  <script src="script.js"></script>
  <script src="preview.js"></script>
</body>
</html>
